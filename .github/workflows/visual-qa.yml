name: DPP Visual QA

on:
  workflow_run:
    workflows: ["Deploy DPP Analytics"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: dpp-visual-qa
  cancel-in-progress: true

jobs:
  visual-qa:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64, dpp-analytics]
    timeout-minutes: 20

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build browser QA image
        run: |
          set -euo pipefail
          sudo docker build -t dpp-visual-qa:local qa

      - name: Capture and inspect the DPP UI
        id: qa
        run: |
          set -uo pipefail
          sudo rm -rf /tmp/dpp-visual-qa
          sudo install -d -m 0777 /tmp/dpp-visual-qa

          set +e
          sudo docker run --rm --network host \
            -v /tmp/dpp-visual-qa:/out \
            dpp-visual-qa:local \
            http://127.0.0.1:8088 /out \
            | tee /tmp/dpp-visual-qa-run.txt
          rc=${PIPESTATUS[0]}
          set -e

          sudo chown -R "$(id -u):$(id -g)" /tmp/dpp-visual-qa
          rm -rf visual-qa-artifact
          mkdir -p visual-qa-artifact
          cp -a /tmp/dpp-visual-qa/. visual-qa-artifact/
          cp /tmp/dpp-visual-qa-run.txt visual-qa-artifact/run.txt || true

          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          if [[ -s visual-qa-artifact/report.md ]]; then
            cat visual-qa-artifact/report.md
          fi

      - name: Prepare QA heartbeat summary
        if: always()
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          QA_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib

          p = pathlib.Path('visual-qa-artifact/summary.json')
          lines = [
              '## Visual QA',
              '',
              f"**Deployment commit:** `{os.environ['DEPLOY_SHA']}`",
              f"**QA run ID:** `{os.environ['QA_RUN_ID']}`",
              f"**Artifact:** `dpp-visual-qa-{os.environ['QA_RUN_ID']}`",
          ]
          if p.exists():
              d = json.loads(p.read_text())
              lines += [
                  f"**Captures:** {d.get('successfulCaptures', 0)}/{d.get('captures', 0)} successful",
                  f"**Signals:** {d.get('horizontalOverflowCaptures', 0)} overflow · {d.get('smallTextSignals', 0)} small-text · {d.get('smallTapTargetSignals', 0)} small-target · {d.get('consoleErrorCount', 0)} browser errors",
                  '',
                  'Most flagged screens:',
              ]
              ranked = sorted(
                  d.get('results', []),
                  key=lambda r: (
                      r.get('metrics', {}).get('horizontalOverflowPx', 0),
                      r.get('metrics', {}).get('smallTextCount', 0),
                      r.get('metrics', {}).get('smallTapTargetCount', 0),
                  ),
                  reverse=True,
              )[:5]
              for r in ranked:
                  m = r.get('metrics') or {}
                  lines.append(
                      f"- {r.get('scenario')} / {r.get('viewport')}: "
                      f"overflow {m.get('horizontalOverflowPx', '—')}px, "
                      f"small text {m.get('smallTextCount', '—')}, "
                      f"small targets {m.get('smallTapTargetCount', '—')}"
                  )
          else:
              lines += ['', '**Capture report unavailable.** The visual-QA job did not produce summary.json.']
          lines += ['', '_Screenshots and machine-readable measurements are stored in the workflow artifact._', '']
          pathlib.Path('/tmp/dpp-visual-qa-heartbeat.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY

      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dpp-visual-qa-${{ github.run_id }}
          path: visual-qa-artifact
          if-no-files-found: warn
          retention-days: 30

      - name: Attach QA summary to deployment heartbeat
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const qa = fs.existsSync('/tmp/dpp-visual-qa-heartbeat.md')
              ? fs.readFileSync('/tmp/dpp-visual-qa-heartbeat.md', 'utf8')
              : '## Visual QA\n\nQA summary was not generated.';
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
            });
            const base = (issue.data.body || '').replace(/\n## Visual QA\n[\s\S]*$/, '').trimEnd();
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `${base}\n\n${qa}`,
            });

      - name: Mark navigation failures
        if: always() && steps.qa.outputs.exit_code != '0'
        run: |
          echo "Visual QA detected one or more page/navigation failures. See the uploaded artifact." >&2
          exit 1
