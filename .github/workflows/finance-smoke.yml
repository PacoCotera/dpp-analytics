name: Finance API Smoke

on:
  workflow_run:
    workflows: ["Deploy DPP Analytics"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  finance-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, dpp-analytics]
    timeout-minutes: 5
    steps:
      - name: Probe deployed Finance API
        run: |
          set -euo pipefail
          code=""
          for i in $(seq 1 20); do
            code="$(curl -sS -o /tmp/finance-smoke.json -w '%{http_code}' http://127.0.0.1:8088/api/finance || true)"
            [[ "$code" == "200" ]] && break
            sleep 2
          done
          DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
          [[ -n "$DEPLOY_SHA" ]] || DEPLOY_SHA="${GITHUB_SHA}"
          {
            echo '# Finance API smoke'
            echo
            echo "Deployed commit: \`${DEPLOY_SHA}\`"
            echo "HTTP: \`${code:-curl-error}\`"
            echo
            echo '## Period model'
            echo '```text'
            python3 - <<'PY'
          import json
          p=json.load(open('/tmp/finance-smoke.json'))
          c=p.get('current_month') or {}
          a=p.get('closed_aggregate') or {}
          closed=p.get('closed_months') or []
          finalizing=p.get('finalizing_months') or []
          print('current:', c.get('month'), c.get('state'))
          print('current sales ex IVA:', c.get('net_sales_ex_vat'))
          print('current IVA:', c.get('iva_on_sales'))
          print('current customer spend:', c.get('shopper_product_spend'))
          print('current released order net:', c.get('amazon_order_net'))
          print('current COGS:', c.get('product_cogs'), 'coverage', c.get('cogs_coverage_pct'))
          print('current contribution before ads:', c.get('estimated_contribution_before_current_ads'))
          print('closed months:', len(closed))
          print('finalizing months:', [(m.get('month'), m.get('close_waits_for')) for m in finalizing])
          print('closed sales:', a.get('net_sales_ex_vat'))
          print('closed contribution:', a.get('contribution_after_product_cogs'))
          print('closed margin:', a.get('contribution_margin_pct'))
          print('diagnostic:', p.get('diagnostic'))
          print('\nclosed detail:')
          for m in closed:
              print(m.get('month'), 'sales=',m.get('net_sales_ex_vat'),'amazon_effect=',m.get('amazon_order_effect'),'ads=',m.get('advertising'),'cogs=',m.get('product_cogs'),'contribution=',m.get('contribution_after_product_cogs'),'margin=',m.get('contribution_margin_pct'),'release=',m.get('release_coverage_pct'))
          PY
            echo '```'
            if [[ "$code" != "200" ]]; then
              echo
              echo '## Board logs'
              echo '```text'
              sudo docker logs --tail 120 dpp-board 2>&1 || true
              echo '```'
            fi
          } >/tmp/finance-smoke.md
          cat /tmp/finance-smoke.md
          [[ "$code" == "200" ]]
      - name: Publish diagnostic
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const body=fs.existsSync('/tmp/finance-smoke.md') ? fs.readFileSync('/tmp/finance-smoke.md','utf8') : '# Finance API smoke\nNo diagnostic file produced.';
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:10,body});
