name: Finance API Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  finance-smoke:
    runs-on: [self-hosted, linux, x64, dpp-analytics]
    timeout-minutes: 7
    steps:
      - name: Probe Finance API and reconcile sources
        id: probe
        run: |
          set +e
          sleep 10
          code="$(curl -sS -o /tmp/finance-smoke.json -w '%{http_code}' http://127.0.0.1:8088/api/finance)"
          rc=$?

          set -a
          source /etc/dpp-analytics/env
          set +a
          psqlq() {
            sudo docker exec -e PGPASSWORD="$POSTGRES_PASSWORD" dpp-postgres \
              psql -X -q -P pager=off -P footer=off -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "$1" 2>&1
          }

          {
            echo "# Finance API smoke + reconciliation"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "HTTP: \`${code:-curl-error}\`"
            echo "curl rc: \`${rc}\`"
            echo
            echo '## API payload'
            echo '```json'
            cat /tmp/finance-smoke.json 2>/dev/null || true
            echo
            echo '```'
            echo
            echo '## 28-day comparable sources'
            echo '```text'
            psqlq "WITH d AS (SELECT max(posted_date) p FROM core.financial_transaction WHERE marketplace_id='A1AM78C64UM0Y8'), b AS (SELECT (p AT TIME ZONE 'America/Mexico_City')::date e, ((p AT TIME ZONE 'America/Mexico_City')::date-27) s FROM d) SELECT 'business_net_sales' metric, round(sum(sales),2) amount FROM mart.business_daily,b WHERE marketplace_id='A1AM78C64UM0Y8' AND business_date BETWEEN b.s AND b.e UNION ALL SELECT 'order_item_tax',round(COALESCE(sum(i.proceeds_tax_amount),0),2) FROM core.amazon_order o JOIN core.amazon_order_item i USING(amazon_order_id),b WHERE o.marketplace_id='A1AM78C64UM0Y8' AND (o.created_time AT TIME ZONE 'America/Mexico_City')::date BETWEEN b.s AND b.e AND o.fulfillment_status IS DISTINCT FROM 'CANCELLED' UNION ALL SELECT 'finance_ads_posted',round(COALESCE(sum(total_amount),0),2) FROM core.financial_transaction,d WHERE marketplace_id='A1AM78C64UM0Y8' AND transaction_type='ProductAdsPayment' AND posted_date>=d.p-interval '28 days' AND posted_date<=d.p UNION ALL SELECT 'finance_transfers_posted',round(COALESCE(sum(total_amount),0),2) FROM core.financial_transaction,d WHERE marketplace_id='A1AM78C64UM0Y8' AND transaction_type='Transfer' AND posted_date>=d.p-interval '28 days' AND posted_date<=d.p;"
            echo '```'
            echo
            echo '## ProductCharges diagnosis'
            echo '```text'
            psqlq "WITH d AS (SELECT max(posted_date) p FROM core.financial_transaction WHERE marketplace_id='A1AM78C64UM0Y8') SELECT transaction_type,breakdown_path,count(*) n,round(sum(amount),2) amount FROM mart.finance_leaf_breakdown,d WHERE marketplace_id='A1AM78C64UM0Y8' AND posted_date>=d.p-interval '28 days' AND posted_date<=d.p AND breakdown_type='ProductCharges' GROUP BY transaction_type,breakdown_path ORDER BY abs(sum(amount)) DESC;"
            echo '```'
            echo
            echo '## Largest raw leaf labels, 28 days'
            echo '```text'
            psqlq "WITH d AS (SELECT max(posted_date) p FROM core.financial_transaction WHERE marketplace_id='A1AM78C64UM0Y8') SELECT breakdown_type,count(*) n,round(sum(amount),2) amount FROM mart.finance_leaf_breakdown,d WHERE marketplace_id='A1AM78C64UM0Y8' AND posted_date>=d.p-interval '28 days' AND posted_date<=d.p GROUP BY breakdown_type ORDER BY abs(sum(amount)) DESC LIMIT 20;"
            echo '```'
            echo
            echo '## Settlement amount taxonomy'
            echo '```text'
            psqlq "SELECT amount_type,amount_description,count(*) n,round(sum(amount),2) amount FROM core.settlement_line WHERE marketplace_id='A1AM78C64UM0Y8' GROUP BY amount_type,amount_description ORDER BY abs(sum(amount)) DESC LIMIT 35;"
            echo '```'
            echo
            echo '## Monthly operating + cash clocks'
            echo '```text'
            psqlq "WITH months AS (SELECT generate_series(date_trunc('month',CURRENT_DATE)-interval '9 months',date_trunc('month',CURRENT_DATE),interval '1 month')::date m), sales AS (SELECT date_trunc('month',business_date)::date m,sum(sales) net_sales FROM mart.business_daily WHERE marketplace_id='A1AM78C64UM0Y8' GROUP BY 1), tax AS (SELECT date_trunc('month',o.created_time AT TIME ZONE 'America/Mexico_City')::date m,sum(COALESCE(i.proceeds_tax_amount,0)) tax FROM core.amazon_order o JOIN core.amazon_order_item i USING(amazon_order_id) WHERE o.marketplace_id='A1AM78C64UM0Y8' AND o.fulfillment_status IS DISTINCT FROM 'CANCELLED' GROUP BY 1), fin AS (SELECT date_trunc('month',posted_date AT TIME ZONE 'America/Mexico_City')::date m,sum(total_amount) FILTER(WHERE transaction_type='ProductAdsPayment') ads,sum(total_amount) FILTER(WHERE transaction_type='Transfer') transfers,sum(total_amount) FILTER(WHERE transaction_type NOT IN ('Transfer','DebtRecovery','AdhocDisbursement')) op_net FROM core.financial_transaction WHERE marketplace_id='A1AM78C64UM0Y8' GROUP BY 1) SELECT to_char(months.m,'YYYY-MM') month,round(COALESCE(s.net_sales,0),2) net_sales,round(COALESCE(t.tax,0),2) iva,round(COALESCE(f.ads,0),2) ads_posted,round(COALESCE(f.op_net,0),2) amazon_operating_net,round(COALESCE(f.transfers,0),2) transfers FROM months LEFT JOIN sales s USING(m) LEFT JOIN tax t USING(m) LEFT JOIN fin f USING(m) ORDER BY months.m;"
            echo '```'
            echo
            echo '## Board logs'
            echo '```text'
            sudo docker logs --tail 120 dpp-board 2>&1 || true
            echo '```'
          } >/tmp/finance-smoke.md
          cat /tmp/finance-smoke.md
          [[ "$code" == "200" ]]
      - name: Publish diagnostic
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const body=fs.existsSync('/tmp/finance-smoke.md') ? fs.readFileSync('/tmp/finance-smoke.md','utf8') : '# Finance API smoke\nNo diagnostic file produced.';
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:10,body});
