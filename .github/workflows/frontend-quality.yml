name: Frontend quality

on:
  pull_request:
    paths:
      - 'board/static/**'
      - 'board/package.json'
      - 'board/eslint.config.js'
      - 'board/.stylelintrc.json'
      - 'board/.prettierrc.json'
      - '.github/workflows/frontend-quality.yml'
  push:
    paths:
      - 'board/static/**'
      - 'board/package.json'
      - 'board/eslint.config.js'
      - 'board/.stylelintrc.json'
      - 'board/.prettierrc.json'
      - '.github/workflows/frontend-quality.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend tooling
        run: npm install --no-package-lock --ignore-scripts

      - name: Lint frontend
        run: npm run lint
