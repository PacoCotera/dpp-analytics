name: Application quality

on:
  pull_request:
    paths:
      - 'board/static/**'
      - 'board/package.json'
      - 'board/eslint.config.js'
      - 'board/.stylelintrc.json'
      - 'board/.prettierrc.json'
      - 'board/Dockerfile'
      - 'compose.yml'
      - '.env.example'
      - 'sql/init/**'
      - 'sql/migrations/**'
      - 'scripts/migrate.sh'
      - 'scripts/init-host-config.sh'
      - '.github/workflows/frontend-quality.yml'
  push:
    paths:
      - 'board/static/**'
      - 'board/package.json'
      - 'board/eslint.config.js'
      - 'board/.stylelintrc.json'
      - 'board/.prettierrc.json'
      - 'board/Dockerfile'
      - 'compose.yml'
      - '.env.example'
      - 'sql/init/**'
      - 'sql/migrations/**'
      - 'scripts/migrate.sh'
      - 'scripts/init-host-config.sh'
      - '.github/workflows/frontend-quality.yml'

permissions:
  contents: read

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend tooling
        run: npm install --no-package-lock --ignore-scripts

      - name: Lint frontend
        run: npm run lint

  compose-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose with example environment
        run: docker compose --env-file .env.example config --quiet

  migration-chain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start clean PostgreSQL
        run: |
          set -euo pipefail
          docker compose --env-file .env.example up -d postgres
          for i in $(seq 1 30); do
            if docker inspect --format='{{json .State.Health.Status}}' dpp-postgres 2>/dev/null | grep -q healthy; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 dpp-postgres
          exit 1

      - name: Apply full migration chain
        run: bash scripts/migrate.sh .env.example

      - name: Tear down migration database
        if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans
