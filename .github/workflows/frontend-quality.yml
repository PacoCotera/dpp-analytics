name: Application quality

on:
  pull_request:
    paths:
      - 'app/**'
      - 'board/static/**'
      - 'board/presentation/**'
      - 'board/scripts/**'
      - 'board/*.py'
      - 'board/package.json'
      - 'board/eslint.config.js'
      - 'board/.stylelintrc.json'
      - 'board/.prettierrc.json'
      - 'board/Dockerfile'
      - 'compose.yml'
      - '.env.example'
      - 'qa/**'
      - 'sql/init/**'
      - 'sql/migrations/**'
      - 'sql/tests/**'
      - 'scripts/migrate.sh'
      - 'scripts/init-host-config.sh'
      - '.github/workflows/frontend-quality.yml'
permissions:
  contents: read

concurrency:
  group: application-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      board_python: ${{ steps.filter.outputs.board_python }}
      board_image: ${{ steps.filter.outputs.board_image }}
      worker_image: ${{ steps.filter.outputs.worker_image }}
      qa: ${{ steps.filter.outputs.qa }}
      compose: ${{ steps.filter.outputs.compose }}
      migrations: ${{ steps.filter.outputs.migrations }}

    steps:
      - name: Checkout change range
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" >changed-files.txt
          cat changed-files.txt

          workflow_changed=false
          grep -Eq '^\.github/workflows/frontend-quality\.yml$' changed-files.txt && workflow_changed=true

          emit() {
            local name="$1"
            local pattern="$2"
            local value=false
            if [[ "$workflow_changed" == true ]] || grep -Eq "$pattern" changed-files.txt; then
              value=true
            fi
            echo "$name=$value" >>"$GITHUB_OUTPUT"
          }

          emit frontend '^(board/(static/|presentation/|scripts/)|board/(package(-lock)?\.json|eslint\.config\.js|\.stylelintrc\.json|\.prettierrc\.json)$)'
          emit board_python '^board/[^/]+\.py$'
          emit board_image '^(board/(Dockerfile|[^/]+\.py)$|compose\.yml$|\.env\.example$)'
          emit worker_image '^app/'
          emit qa '^qa/'
          emit compose '^(compose\.yml$|\.env\.example$|scripts/init-host-config\.sh$)'
          emit migrations '^(sql/(init|migrations|tests)/|scripts/migrate\.sh$|compose\.yml$|\.env\.example$)'

  frontend-lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend tooling
        run: npm ci --ignore-scripts

      - name: Lint and verify formatting
        run: npm run quality

  board-python:
    needs: changes
    if: needs.changes.outputs.board_python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: board

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile board Python
        run: python -m compileall -q .

      - name: Test board cache, transport, Finance, geography and catalog lifecycle
        run: python -m unittest discover -v -p 'test_*.py'

  board-image:
    needs: changes
    if: needs.changes.outputs.board_image == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deterministic main ref for image fallback
        run: git update-ref refs/heads/main HEAD

      - name: Build production board image
        run: docker build --build-arg DEPLOY_SHA="${GITHUB_SHA}" -f board/Dockerfile -t dpp-board-quality .

  worker-image:
    needs: changes
    if: needs.changes.outputs.worker_image == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production worker image
        run: docker build -t dpp-worker-quality app

  qa-syntax:
    needs: changes
    if: needs.changes.outputs.qa == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate browser QA scripts
        run: |
          set -euo pipefail
          for file in qa/*.mjs; do
            node --check "$file"
          done

  qa-image:
    needs: changes
    if: needs.changes.outputs.qa == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production browser QA image
        run: docker build -t dpp-qa-quality qa

  compose-config:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose with example environment
        run: docker compose --env-file .env.example config --quiet

  migration-chain:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start clean PostgreSQL
        run: |
          set -euo pipefail
          docker compose --env-file .env.example up -d postgres
          for i in $(seq 1 30); do
            if docker inspect --format='{{json .State.Health.Status}}' dpp-postgres 2>/dev/null | grep -q healthy; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 dpp-postgres
          exit 1

      - name: Apply full migration chain
        run: bash scripts/migrate.sh .env.example

      - name: Verify decision ledger round trip
        run: |
          docker compose --env-file .env.example exec -T postgres \
            psql -X -v ON_ERROR_STOP=1 -U dpp -d dpp \
            < sql/tests/decision_ledger_roundtrip.sql

      - name: Verify point-in-time Ads report history
        run: |
          docker compose --env-file .env.example exec -T postgres \
            psql -X -v ON_ERROR_STOP=1 -U dpp -d dpp \
            < sql/tests/ads_report_content_history.sql

      - name: Verify point-in-time shadow evaluation history
        run: |
          docker compose --env-file .env.example exec -T postgres \
            psql -X -v ON_ERROR_STOP=1 -U dpp -d dpp \
            < sql/tests/ads_shadow_evaluation_history.sql

      - name: Tear down migration database
        if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans
