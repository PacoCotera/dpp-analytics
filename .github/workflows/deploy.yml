name: Deploy DPP Analytics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dpp-analytics-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dpp-analytics]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap host
        run: |
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl openssl
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc
            . /etc/os-release
            ARCH="$(dpkg --print-architecture)"
            printf '%s\n' \
              'Types: deb' \
              'URIs: https://download.docker.com/linux/ubuntu' \
              "Suites: ${UBUNTU_CODENAME:-$VERSION_CODENAME}" \
              'Components: stable' \
              "Architectures: ${ARCH}" \
              'Signed-By: /etc/apt/keyrings/docker.asc' \
              | sudo tee /etc/apt/sources.list.d/docker.sources >/dev/null
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            sudo systemctl enable --now docker
          fi

          sudo install -d -m 0750 /etc/dpp-analytics

          if ! sudo test -f /etc/dpp-analytics/env; then
            PG_PASSWORD="$(openssl rand -hex 24)"
            GRAFANA_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
            sudo tee /etc/dpp-analytics/env >/dev/null <<EOF
          POSTGRES_DB=dpp
          POSTGRES_USER=dpp
          POSTGRES_PASSWORD=${PG_PASSWORD}
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
          TZ=America/Mexico_City
          SPAPI_ENABLED=false
          SPAPI_ENVIRONMENT=sandbox
          SPAPI_MARKETPLACE_ID=A1AM78C64UM0Y8
          ORDERS_BACKFILL_START=2025-10-01T00:00:00Z
          EOF
            sudo chmod 0600 /etc/dpp-analytics/env
          fi

          # Safe default: an existing installation without an explicit environment
          # remains in sandbox. Production ingestion requires an intentional switch.
          if ! sudo grep -q '^SPAPI_ENVIRONMENT=' /etc/dpp-analytics/env; then
            echo 'SPAPI_ENVIRONMENT=sandbox' | sudo tee -a /etc/dpp-analytics/env >/dev/null
          fi

          hostname
          sudo docker version
          sudo docker compose version

      - name: Validate compose
        run: |
          set -euo pipefail
          sudo docker compose --env-file /etc/dpp-analytics/env config --quiet

      - name: Pull base images
        run: |
          set -euo pipefail
          sudo docker compose --env-file /etc/dpp-analytics/env pull postgres grafana

      - name: Build worker
        run: |
          set -euo pipefail
          sudo docker compose --env-file /etc/dpp-analytics/env build worker

      - name: Deploy stack
        run: |
          set -euo pipefail
          sudo docker compose --env-file /etc/dpp-analytics/env up -d --remove-orphans

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if sudo docker inspect --format='{{json .State.Health.Status}}' dpp-postgres 2>/dev/null | grep -q healthy; then
              exit 0
            fi
            sleep 2
          done
          sudo docker logs --tail 100 dpp-postgres
          exit 1

      - name: Apply database migrations
        run: |
          set -euo pipefail
          bash scripts/migrate.sh /etc/dpp-analytics/env
          sudo docker compose --env-file /etc/dpp-analytics/env restart worker

      - name: Verify worker
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status="$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' dpp-worker 2>/dev/null || true)"
            if [[ "$status" == "healthy" ]]; then
              sudo docker logs --tail 20 dpp-worker
              exit 0
            fi
            sleep 2
          done
          sudo docker logs --tail 100 dpp-worker
          exit 1

      - name: Verify SP-API sandbox credentials
        run: |
          set -euo pipefail
          SPAPI_ENABLED="$(sudo grep -E '^SPAPI_ENABLED=' /etc/dpp-analytics/env | tail -1 | cut -d= -f2-)"
          SPAPI_ENVIRONMENT="$(sudo grep -E '^SPAPI_ENVIRONMENT=' /etc/dpp-analytics/env | tail -1 | cut -d= -f2-)"
          if [[ "${SPAPI_ENABLED,,}" =~ ^(1|true|yes|on)$ && "${SPAPI_ENVIRONMENT,,}" == "sandbox" ]]; then
            sudo docker compose --env-file /etc/dpp-analytics/env exec -T worker \
              python -m dpp_analytics.sandbox_probe | tee /tmp/dpp-sandbox-probe.json
          else
            echo "Sandbox probe skipped: enabled=${SPAPI_ENABLED:-unknown} environment=${SPAPI_ENVIRONMENT:-unknown}"
          fi

      - name: Verify Grafana
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/grafana-health.json; then
              cat /tmp/grafana-health.json
              exit 0
            fi
            sleep 2
          done
          sudo docker logs --tail 100 dpp-grafana
          exit 1

      - name: Collect deployment heartbeat
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          POSTGRES_DB="$(sudo grep -E '^POSTGRES_DB=' /etc/dpp-analytics/env 2>/dev/null | tail -1 | cut -d= -f2-)"
          POSTGRES_USER="$(sudo grep -E '^POSTGRES_USER=' /etc/dpp-analytics/env 2>/dev/null | tail -1 | cut -d= -f2-)"
          SPAPI_ENABLED="$(sudo grep -E '^SPAPI_ENABLED=' /etc/dpp-analytics/env 2>/dev/null | tail -1 | cut -d= -f2-)"
          SPAPI_ENVIRONMENT="$(sudo grep -E '^SPAPI_ENVIRONMENT=' /etc/dpp-analytics/env 2>/dev/null | tail -1 | cut -d= -f2-)"
          SPAPI_MARKETPLACE_ID="$(sudo grep -E '^SPAPI_MARKETPLACE_ID=' /etc/dpp-analytics/env 2>/dev/null | tail -1 | cut -d= -f2-)"
          {
            echo '# DPP Analytics deployment heartbeat'
            echo
            echo "**Workflow status:** ${JOB_STATUS}"
            echo "**Commit:** \`${DEPLOY_SHA}\`"
            echo "**Run ID:** \`${RUN_ID}\`"
            echo "**UTC:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**Host:** \`$(hostname)\`"
            echo "**LAN addresses:** \`$(hostname -I 2>/dev/null | xargs)\`"
            echo "**SP-API enabled:** \`${SPAPI_ENABLED:-unknown}\`"
            echo "**SP-API environment:** \`${SPAPI_ENVIRONMENT:-unknown}\`"
            echo "**Marketplace:** \`${SPAPI_MARKETPLACE_ID:-unknown}\`"
            echo
            echo '## SP-API sandbox probe'
            echo '```text'
            if [[ -s /tmp/dpp-sandbox-probe.json ]]; then
              cat /tmp/dpp-sandbox-probe.json
            else
              echo 'No successful deployment probe recorded.'
            fi
            echo '```'
            echo
            echo '## Host'
            echo '```text'
            uname -a
            echo
            free -h
            echo
            df -h /
            echo '```'
            echo
            echo '## Docker'
            echo '```text'
            sudo docker version --format 'Engine={{.Server.Version}}' 2>&1 || true
            sudo docker compose version 2>&1 || true
            echo '```'
            echo
            echo '## Containers'
            echo '```text'
            sudo docker compose --env-file /etc/dpp-analytics/env ps 2>&1 || true
            echo '```'
            echo
            echo '## Database migrations'
            echo '```text'
            if [[ -n "$POSTGRES_DB" && -n "$POSTGRES_USER" ]]; then
              sudo docker compose --env-file /etc/dpp-analytics/env exec -T postgres \
                psql -X -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                -c "SELECT filename || ' | ' || applied_at FROM ops.schema_migrations ORDER BY filename;" 2>&1 || true
            fi
            echo '```'
            echo
            echo '## Worker'
            echo '```text'
            sudo docker inspect --format='health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} status={{.State.Status}}' dpp-worker 2>&1 || true
            sudo docker logs --tail 30 dpp-worker 2>&1 || true
            echo '```'
            echo
            echo '## PostgreSQL'
            echo '```text'
            sudo docker inspect --format='health={{.State.Health.Status}} status={{.State.Status}}' dpp-postgres 2>&1 || true
            echo '```'
            echo
            echo '## Grafana'
            echo '```text'
            curl -fsS http://127.0.0.1:3000/api/health 2>&1 || true
            echo
            echo '```'
            echo
            echo '_This issue is updated automatically by the self-hosted deployment runner. No credentials are included._'
          } >/tmp/dpp-heartbeat.md
          cat /tmp/dpp-heartbeat.md

      - name: Publish deployment heartbeat
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.existsSync('/tmp/dpp-heartbeat.md')
              ? fs.readFileSync('/tmp/dpp-heartbeat.md', 'utf8')
              : '# DPP Analytics deployment heartbeat\n\nWorkflow reached the reporting step but no host report was produced.';
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
