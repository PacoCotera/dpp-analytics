name: Deploy DPP Analytics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: dpp-analytics-production
  # Docker/Playwright children can outlive a cancelled self-hosted job and
  # exhaust the runner's inotify/file-descriptor allowance. Queue releases so
  # each deployment reaches its cleanup and heartbeat steps.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dpp-analytics]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize deployment diagnostics
        run: |
          set -euo pipefail
          sudo rm -rf /tmp/dpp-production-visual-qa
          sudo rm -f \
            /tmp/dpp-production-visual-qa-run.txt \
            /tmp/dpp-production-visual-qa-exit-code.txt \
            /tmp/dpp-admin-qa.env \
            /tmp/dpp-finance-close.json \
            /tmp/dpp-spapi-probe.json \
            /tmp/grafana-health.json \
            /tmp/board-health.json \
            /tmp/board-home.json \
            /tmp/board-sales.json \
            /tmp/board-inventory.json \
            /tmp/dpp-heartbeat.md

      - name: Bootstrap host
        run: |
          set -euo pipefail

          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl openssl
            sudo install -m 0755 -d /etc/apt/keyrings
            sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            sudo chmod a+r /etc/apt/keyrings/docker.asc
            . /etc/os-release
            ARCH="$(dpkg --print-architecture)"
            printf '%s\n' \
              'Types: deb' \
              'URIs: https://download.docker.com/linux/ubuntu' \
              "Suites: ${UBUNTU_CODENAME:-$VERSION_CODENAME}" \
              'Components: stable' \
              "Architectures: ${ARCH}" \
              'Signed-By: /etc/apt/keyrings/docker.asc' \
              | sudo tee /etc/apt/sources.list.d/docker.sources >/dev/null
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            sudo systemctl enable --now docker
          fi

          sudo install -d -m 0750 /etc/dpp-analytics

          if ! sudo test -f /etc/dpp-analytics/env; then
            PG_PASSWORD="$(openssl rand -hex 24)"
            GRAFANA_PASSWORD="$(openssl rand -base64 24 | tr -d '\n')"
            sudo tee /etc/dpp-analytics/env >/dev/null <<EOF
          POSTGRES_DB=dpp
          POSTGRES_USER=dpp
          POSTGRES_PASSWORD=${PG_PASSWORD}
          GRAFANA_ADMIN_USER=admin
          GRAFANA_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
          TZ=America/Mexico_City
          SPAPI_ENABLED=false
          SPAPI_ENVIRONMENT=production
          SPAPI_PRODUCTION_INGESTION_ENABLED=true
          SPAPI_MARKETPLACE_ID=A1AM78C64UM0Y8
          ORDERS_BACKFILL_START=2025-10-01T00:00:00Z
          EOF
            sudo chmod 0600 /etc/dpp-analytics/env
          fi

          if sudo grep -q '^SPAPI_ENVIRONMENT=' /etc/dpp-analytics/env; then
            sudo sed -i 's/^SPAPI_ENVIRONMENT=.*/SPAPI_ENVIRONMENT=production/' /etc/dpp-analytics/env
          else
            echo 'SPAPI_ENVIRONMENT=production' | sudo tee -a /etc/dpp-analytics/env >/dev/null
          fi

          if sudo grep -q '^SPAPI_PRODUCTION_INGESTION_ENABLED=' /etc/dpp-analytics/env; then
            sudo sed -i 's/^SPAPI_PRODUCTION_INGESTION_ENABLED=.*/SPAPI_PRODUCTION_INGESTION_ENABLED=true/' /etc/dpp-analytics/env
          else
            echo 'SPAPI_PRODUCTION_INGESTION_ENABLED=true' | sudo tee -a /etc/dpp-analytics/env >/dev/null
          fi

          DPP_ADMIN_PASSWORD_CURRENT="$(sudo awk -F= '$1 == "DPP_ADMIN_PASSWORD" { sub(/^[^=]*=/, ""); print; exit }' /etc/dpp-analytics/env)"
          if [[ "${#DPP_ADMIN_PASSWORD_CURRENT}" -lt 16 || "$DPP_ADMIN_PASSWORD_CURRENT" == CHANGE_ME* ]]; then
            DPP_ADMIN_PASSWORD="$(openssl rand -hex 32)"
            if sudo grep -q '^DPP_ADMIN_PASSWORD=' /etc/dpp-analytics/env; then
              sudo sed -i "s/^DPP_ADMIN_PASSWORD=.*/DPP_ADMIN_PASSWORD=${DPP_ADMIN_PASSWORD}/" /etc/dpp-analytics/env
            else
              echo "DPP_ADMIN_PASSWORD=${DPP_ADMIN_PASSWORD}" | sudo tee -a /etc/dpp-analytics/env >/dev/null
            fi
          fi

          # Temporary #204 operating decision: expose password-protected Admin
          # through the direct-HTTP public board until app-wide auth replaces it.
          if sudo grep -q '^DPP_ADMIN_COOKIE_SECURE=' /etc/dpp-analytics/env; then
            sudo sed -i 's/^DPP_ADMIN_COOKIE_SECURE=.*/DPP_ADMIN_COOKIE_SECURE=false/' /etc/dpp-analytics/env
          else
            echo 'DPP_ADMIN_COOKIE_SECURE=false' | sudo tee -a /etc/dpp-analytics/env >/dev/null
          fi

          if sudo grep -q '^DPP_ADMIN_ALLOW_REMOTE=' /etc/dpp-analytics/env; then
            sudo sed -i 's/^DPP_ADMIN_ALLOW_REMOTE=.*/DPP_ADMIN_ALLOW_REMOTE=true/' /etc/dpp-analytics/env
          else
            echo 'DPP_ADMIN_ALLOW_REMOTE=true' | sudo tee -a /etc/dpp-analytics/env >/dev/null
          fi

          hostname
          sudo docker version
          sudo docker compose version

      - name: Initialize local board config
        run: |
          set -euo pipefail
          bash scripts/init-host-config.sh

      - name: Validate compose
        run: |
          set -euo pipefail
          sudo docker compose --env-file /etc/dpp-analytics/env config --quiet

      - name: Pull base images
        run: |
          set -euo pipefail
          sudo docker compose --env-file /etc/dpp-analytics/env pull postgres grafana

      - name: Build application images
        run: |
          set -euo pipefail
          sudo docker compose --env-file /etc/dpp-analytics/env build worker board

      # Keep database migrations ahead of new worker code. This also means a
      # board-only change no longer restarts the ingestion worker unnecessarily.
      - name: Ensure database is running
        run: |
          set -euo pipefail
          sudo docker compose --env-file /etc/dpp-analytics/env up -d postgres

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if sudo docker inspect --format='{{json .State.Health.Status}}' dpp-postgres 2>/dev/null | grep -q healthy; then
              exit 0
            fi
            sleep 2
          done
          sudo docker logs --tail 100 dpp-postgres
          exit 1

      - name: Apply database migrations
        run: |
          set -euo pipefail
          bash scripts/migrate.sh /etc/dpp-analytics/env

      - name: Backfill historical product costs
        run: |
          set -euo pipefail
          sudo python3 scripts/backfill-historical-product-costs.py \
            /etc/dpp-analytics/board-config/product_costs.json

      - name: Refresh finance month close
        run: |
          set -euo pipefail
          sudo docker compose --env-file /etc/dpp-analytics/env run --rm --no-deps worker \
            python -m dpp_analytics.finance_close | tee /tmp/dpp-finance-close.json

      - name: Deploy application stack
        run: |
          set -euo pipefail
          sudo docker compose --env-file /etc/dpp-analytics/env up -d --remove-orphans

      - name: Verify worker
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status="$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' dpp-worker 2>/dev/null || true)"
            if [[ "$status" == "healthy" ]]; then
              sudo docker logs --tail 30 dpp-worker
              exit 0
            fi
            sleep 2
          done
          sudo docker logs --tail 100 dpp-worker
          exit 1

      - name: Verify SP-API authorization
        run: |
          set -euo pipefail
          SPAPI_ENABLED="$(sudo grep -E '^SPAPI_ENABLED=' /etc/dpp-analytics/env | tail -1 | cut -d= -f2-)"
          SPAPI_ENVIRONMENT="$(sudo grep -E '^SPAPI_ENVIRONMENT=' /etc/dpp-analytics/env | tail -1 | cut -d= -f2-)"
          if [[ ! "${SPAPI_ENABLED,,}" =~ ^(1|true|yes|on)$ ]]; then
            echo 'SP-API disabled; authorization probe skipped.'
          elif [[ "${SPAPI_ENVIRONMENT,,}" == "sandbox" ]]; then
            sudo docker compose --env-file /etc/dpp-analytics/env exec -T worker \
              python -m dpp_analytics.sandbox_probe | tee /tmp/dpp-spapi-probe.json
          elif [[ "${SPAPI_ENVIRONMENT,,}" == "production" ]]; then
            sudo docker compose --env-file /etc/dpp-analytics/env exec -T worker \
              python -m dpp_analytics.production_probe | tee /tmp/dpp-spapi-probe.json
          else
            echo "Unknown SPAPI_ENVIRONMENT=${SPAPI_ENVIRONMENT}" >&2
            exit 1
          fi

      - name: Verify Grafana
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/tmp/grafana-health.json; then
              cat /tmp/grafana-health.json
              exit 0
            fi
            sleep 2
          done
          sudo docker logs --tail 100 dpp-grafana
          exit 1

      - name: Verify operating boards
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/health >/tmp/board-health.json \
              && curl -fsS http://127.0.0.1:8088/api/home >/tmp/board-home.json \
              && curl -fsS http://127.0.0.1:8088/api/sales >/tmp/board-sales.json \
              && curl -fsS http://127.0.0.1:8088/api/inventory >/tmp/board-inventory.json \
              && curl -fsS -o /dev/null http://127.0.0.1:8088/sales \
              && curl -fsS -o /dev/null http://127.0.0.1:8088/inventory; then
              cat /tmp/board-health.json
              python3 - <<'PY'
          import json
          h=json.load(open('/tmp/board-home.json'))
          s=json.load(open('/tmp/board-sales.json'))
          i=json.load(open('/tmp/board-inventory.json'))
          print('home=ok today_sales=%s movers=%s actions=%s' % (
              h.get('today',{}).get('sales_today'), len(h.get('movers',[])), len(h.get('inventory',[]))))
          print('sales=ok t28=%s skus=%s orders=%s' % (
              s.get('headline',{}).get('sales_t28'), len(s.get('skus',[])), len(s.get('orders',[]))))
          print('inventory=ok available=%s inbound=%s rows=%s' % (
              i.get('summary',{}).get('available'), i.get('summary',{}).get('inbound'), len(i.get('rows',[]))))
          PY
              exit 0
            fi
            sleep 2
          done
          sudo docker logs --tail 150 dpp-board
          exit 1

      - name: Build production browser QA image
        run: |
          set -euo pipefail
          sudo docker build -t dpp-production-visual-qa:local qa

      - name: Test the deployed UI in a browser
        run: |
          set -uo pipefail
          qa_container="dpp-production-visual-qa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup_qa() {
            sudo docker rm -f "$qa_container" >/dev/null 2>&1 || true
            sudo rm -f /tmp/dpp-admin-qa.env
          }
          trap cleanup_qa EXIT INT TERM

          # Recover automatically from any previously interrupted labeled run.
          mapfile -t stale_qa < <(
            sudo docker ps -aq \
              --filter label=com.dpp-analytics.role=production-browser-qa
          )
          if [[ "${#stale_qa[@]}" -gt 0 ]]; then
            sudo docker rm -f "${stale_qa[@]}" >/dev/null
          fi

          sudo rm -rf /tmp/dpp-production-visual-qa
          sudo install -d -m 0777 /tmp/dpp-production-visual-qa
          cleanup_qa

          sudo awk -F= '$1 == "DPP_ADMIN_PASSWORD" { print; exit }' /etc/dpp-analytics/env \
            | sudo tee /tmp/dpp-admin-qa.env >/dev/null
          sudo chmod 0600 /tmp/dpp-admin-qa.env

          set +e
          # The complete browser gate now includes the cross-route Ads contract.
          # Keep the wrapper below the 30-minute job limit while leaving enough
          # time for the final admin and artifact-copy steps on the shared runner.
          timeout --signal=TERM --kill-after=30s 25m \
            sudo docker run --rm \
              --name "$qa_container" \
              --label com.dpp-analytics.role=production-browser-qa \
              --label "com.dpp-analytics.run-id=${GITHUB_RUN_ID}" \
              --network host \
              --env-file /tmp/dpp-admin-qa.env \
              -v /tmp/dpp-production-visual-qa:/out \
              dpp-production-visual-qa:local \
              http://127.0.0.1:8088 /out \
            | tee /tmp/dpp-production-visual-qa-run.txt
          rc=${PIPESTATUS[0]}
          cleanup_qa
          printf '%s\n' "$rc" >/tmp/dpp-production-visual-qa-exit-code.txt
          set -e

          sudo chown -R "$(id -u):$(id -g)" /tmp/dpp-production-visual-qa
          if [[ -s /tmp/dpp-production-visual-qa/report.md ]]; then
            cat /tmp/dpp-production-visual-qa/report.md
          fi
          exit "$rc"

      - name: Upload compact production QA summaries
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dpp-production-visual-qa-${{ github.run_id }}
          path: |
            /tmp/dpp-production-visual-qa/report.md
            /tmp/dpp-production-visual-qa/summary.json
            /tmp/dpp-production-visual-qa/**/*-summary.json
            /tmp/dpp-production-visual-qa/**/ads-business-impact-desktop.png
            /tmp/dpp-production-visual-qa/**/ads-demand-mobile.png
            /tmp/dpp-production-visual-qa/performance-candidate-baseline.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 9

      - name: Upload full production QA failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dpp-production-visual-qa-${{ github.run_id }}
          path: |
            /tmp/dpp-production-visual-qa
            /tmp/dpp-production-visual-qa-run.txt
            /tmp/dpp-production-visual-qa-exit-code.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9

      - name: Collect deployment heartbeat
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOY_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          POSTGRES_DB="$(sudo grep -E '^POSTGRES_DB=' /etc/dpp-analytics/env 2>/dev/null | tail -1 | cut -d= -f2-)"
          POSTGRES_USER="$(sudo grep -E '^POSTGRES_USER=' /etc/dpp-analytics/env 2>/dev/null | tail -1 | cut -d= -f2-)"
          SPAPI_ENABLED="$(sudo grep -E '^SPAPI_ENABLED=' /etc/dpp-analytics/env 2>/dev/null | tail -1 | cut -d= -f2-)"
          SPAPI_ENVIRONMENT="$(sudo grep -E '^SPAPI_ENVIRONMENT=' /etc/dpp-analytics/env 2>/dev/null | tail -1 | cut -d= -f2-)"
          SPAPI_PRODUCTION_INGESTION_ENABLED="$(sudo grep -E '^SPAPI_PRODUCTION_INGESTION_ENABLED=' /etc/dpp-analytics/env 2>/dev/null | tail -1 | cut -d= -f2-)"
          SPAPI_MARKETPLACE_ID="$(sudo grep -E '^SPAPI_MARKETPLACE_ID=' /etc/dpp-analytics/env 2>/dev/null | tail -1 | cut -d= -f2-)"
          {
            echo '# DPP Analytics deployment heartbeat'
            echo
            echo "**Workflow status:** ${JOB_STATUS}"
            echo "**Commit:** \`${DEPLOY_SHA}\`"
            echo "**Run ID:** \`${RUN_ID}\`"
            echo "**UTC:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**Host:** \`$(hostname)\`"
            echo "**LAN addresses:** \`$(hostname -I 2>/dev/null | xargs)\`"
            echo "**SP-API enabled:** \`${SPAPI_ENABLED:-unknown}\`"
            echo "**SP-API environment:** \`${SPAPI_ENVIRONMENT:-unknown}\`"
            echo "**Production ingestion:** \`${SPAPI_PRODUCTION_INGESTION_ENABLED:-unknown}\`"
            echo "**Marketplace:** \`${SPAPI_MARKETPLACE_ID:-unknown}\`"
            echo
            echo '## SP-API authorization probe'
            echo '```text'
            if [[ -s /tmp/dpp-spapi-probe.json ]]; then cat /tmp/dpp-spapi-probe.json; else echo 'No successful deployment probe recorded.'; fi
            echo '```'
            echo
            echo '## Host'
            echo '```text'
            uname -a; echo; free -h; echo; df -h /
            echo '```'
            echo
            echo '## Docker'
            echo '```text'
            sudo docker version --format 'Engine={{.Server.Version}}' 2>&1 || true
            sudo docker compose version 2>&1 || true
            echo '```'
            echo
            echo '## Containers'
            echo '```text'
            sudo docker compose --env-file /etc/dpp-analytics/env ps 2>&1 || true
            echo '```'
            echo
            echo '## Database migrations'
            echo '```text'
            if [[ -n "$POSTGRES_DB" && -n "$POSTGRES_USER" ]]; then
              sudo docker compose --env-file /etc/dpp-analytics/env exec -T postgres \
                psql -X -At -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
                -c "SELECT filename || ' | ' || applied_at FROM ops.schema_migrations ORDER BY filename;" 2>&1 || true
            fi
            echo '```'
            echo
            echo '## Worker'
            echo '```text'
            sudo docker inspect --format='health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} status={{.State.Status}}' dpp-worker 2>&1 || true
            sudo docker logs --tail 40 dpp-worker 2>&1 || true
            echo '```'
            echo
            echo '## PostgreSQL'
            echo '```text'
            sudo docker inspect --format='health={{.State.Health.Status}} status={{.State.Status}}' dpp-postgres 2>&1 || true
            echo '```'
            echo
            echo '## Grafana'
            echo '```text'
            curl -fsS http://127.0.0.1:3000/api/health 2>&1 || true; echo
            echo '```'
            echo
            echo '## Operating board'
            echo '```text'
            sudo docker inspect --format='health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} status={{.State.Status}}' dpp-board 2>&1 || true
            curl -fsS http://127.0.0.1:8088/health 2>&1 || true; echo
            if [[ -s /tmp/board-home.json ]]; then
              python3 - <<'PY' || true
          import json
          h=json.load(open('/tmp/board-home.json'))
          print('home today_sales=%s t28_sales=%s growth=%s movers=%s actions=%s' % (
              h.get('today',{}).get('sales_today'), h.get('rolling',{}).get('sales_t28'),
              h.get('rolling',{}).get('delta28_pct'), len(h.get('movers',[])), len(h.get('inventory',[]))))
          if __import__('os').path.exists('/tmp/board-sales.json'):
              s=json.load(open('/tmp/board-sales.json'))
              print('sales t28=%s skus=%s recent_orders=%s' % (
                  s.get('headline',{}).get('sales_t28'), len(s.get('skus',[])), len(s.get('orders',[]))))
          if __import__('os').path.exists('/tmp/board-inventory.json'):
              i=json.load(open('/tmp/board-inventory.json'))
              print('inventory available=%s inbound=%s rows=%s actions=%s' % (
                  i.get('summary',{}).get('available'), i.get('summary',{}).get('inbound'),
                  len(i.get('rows',[])), i.get('summary',{}).get('needs_action')))
          PY
            fi
            echo '```'
            echo
            echo '## Production browser QA'
            echo '```text'
            if [[ -s /tmp/dpp-production-visual-qa-exit-code.txt ]]; then
              echo "suite_exit_code=$(cat /tmp/dpp-production-visual-qa-exit-code.txt)"
            else
              echo 'suite_exit_code=not_recorded'
            fi
            if [[ -s /tmp/dpp-production-visual-qa/summary.json ]]; then
              python3 - <<'PY' || true
          import json
          q=json.load(open('/tmp/dpp-production-visual-qa/summary.json'))
          print('captures=%s/%s browser_errors=%s failed_responses=%s overflow_captures=%s' % (
              q.get('successfulCaptures'), q.get('captures'), q.get('consoleErrorCount'),
              q.get('failedResponseCount'), q.get('horizontalOverflowCaptures')))
          for r in q.get('results', []):
              if not r.get('ok'):
                  print('%s/%s: %s' % (
                      r.get('scenario'), r.get('viewport'),
                      '; '.join((r.get('errors') or []) + (r.get('failedResponses') or []))))
          PY
            else
              echo 'Production browser QA did not produce summary.json.'
            fi
            python3 - <<'PY' || true
          import json
          from pathlib import Path

          root = Path('/tmp/dpp-production-visual-qa')
          for summary_path in sorted(root.glob('*-summary.json')):
              try:
                  summary = json.loads(summary_path.read_text())
              except Exception as error:
                  print('%s: INVALID (%s)' % (summary_path.name, error))
                  continue

              failures = []
              for key in ('failures', 'errors'):
                  value = summary.get(key)
                  if isinstance(value, list):
                      failures.extend(str(item) for item in value if item)
              if summary.get('error'):
                  failures.append(str(summary['error']))

              results = summary.get('results')
              if isinstance(results, list):
                  for result in results:
                      if not isinstance(result, dict) or result.get('ok', True):
                          continue
                      name = result.get('name') or result.get('scenario') or 'check'
                      detail = result.get('error')
                      if not detail:
                          detail = '; '.join(str(item) for item in result.get('errors', []) if item)
                      failures.append('%s: %s' % (name, detail or 'failed'))

              raw_status = summary.get('status')
              if isinstance(raw_status, str):
                  status = raw_status.upper()
              elif isinstance(summary.get('ok'), bool):
                  status = 'PASS' if summary['ok'] else 'FAIL'
              else:
                  status = 'FAIL' if failures else 'PASS'

              checks = summary.get('checks')
              if isinstance(checks, list):
                  detail = ' checks=%s' % len(checks)
              elif isinstance(results, list):
                  detail = ' checks=%s/%s' % (
                      sum(1 for result in results if isinstance(result, dict) and result.get('ok')),
                      len(results),
                  )
              else:
                  detail = ''

              print('%s: %s%s' % (summary_path.stem, status, detail))
              for failure in dict.fromkeys(failures):
                  print('  - %s' % failure)
          PY
            echo '```'
            echo
            echo '_This issue is updated automatically by the self-hosted deployment runner. No credentials are included._'
          } >/tmp/dpp-heartbeat.md
          cat /tmp/dpp-heartbeat.md

      - name: Publish deployment heartbeat
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.existsSync('/tmp/dpp-heartbeat.md')
              ? fs.readFileSync('/tmp/dpp-heartbeat.md', 'utf8')
              : '# DPP Analytics deployment heartbeat\n\nWorkflow reached the reporting step but no host report was produced.';
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });
