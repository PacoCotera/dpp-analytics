name: Amazon Source Readiness

on:
  workflow_call:
    inputs:
      nested:
        description: Run beneath a caller that already owns the production lock.
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  # A called probe runs inside the deployment workflow, whose production
  # concurrency lock is still held. Manual runs acquire that production lock
  # directly. A distinct called-workflow group avoids a nested-lock deadlock.
  group: ${{ inputs.nested && format('dpp-source-readiness-{0}', github.run_id) || 'dpp-analytics-production' }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, dpp-analytics]
    timeout-minutes: 120
    env:
      PROBE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROBE_SHA }}

      - name: Build isolated probe image
        run: |
          set -euo pipefail
          image="dpp-amazon-source-readiness:${PROBE_SHA}"
          sudo docker build -t "$image" app

      - name: Run read-only production capability probes
        id: probe
        run: |
          set -uo pipefail
          output_dir="/tmp/dpp-amazon-source-readiness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="dpp-amazon-source-readiness:${PROBE_SHA}"
          sudo install -d -m 0777 "$output_dir"
          set +e
          timeout --signal=TERM --kill-after=30s 100m \
            sudo docker run --rm \
              --network container:dpp-worker \
              --env-file /etc/dpp-analytics/env \
              -e GITHUB_SHA="${PROBE_SHA}" \
              -e AMAZON_SOURCE_PROBE_REPORT_TIMEOUT_SECONDS=1800 \
              -e AMAZON_SOURCE_PROBE_ADS_REPORT_TIMEOUT_SECONDS=1800 \
              -e AMAZON_SOURCE_PROBE_REPORT_POLL_SECONDS=10 \
              -v "$output_dir:/out" \
              "$image" \
              python -m dpp_analytics.amazon_capability_probe \
                --json-output /out/amazon-source-readiness.json \
                --markdown-output /out/amazon-source-readiness.md \
            | tee "$output_dir/run.log"
          rc=${PIPESTATUS[0]}
          set -e
          sudo chown -R "$(id -u):$(id -g)" "$output_dir"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-source-readiness-${{ env.PROBE_SHA }}
          path: |
            ${{ steps.probe.outputs.output_dir }}/amazon-source-readiness.json
            ${{ steps.probe.outputs.output_dir }}/amazon-source-readiness.md
            ${{ steps.probe.outputs.output_dir }}/run.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish controller evidence
        if: always()
        uses: actions/github-script@v7
        env:
          OUTPUT_DIR: ${{ steps.probe.outputs.output_dir }}
          PROBE_EXIT_CODE: ${{ steps.probe.outputs.exit_code }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- dpp-amazon-source-readiness -->';
            const reportPath = path.join(process.env.OUTPUT_DIR || '', 'amazon-source-readiness.md');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (fs.existsSync(reportPath)) {
              body = fs.readFileSync(reportPath, 'utf8');
              body += `\nWorkflow: ${runUrl}\n`;
            } else {
              body = `${marker}\n## Advertising V2 Amazon source-readiness probe\n\nThe probe harness failed before producing sanitized evidence. Exit code: \`${process.env.PROBE_EXIT_CODE || 'unknown'}\`.\n\nWorkflow: ${runUrl}\n`;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 449,
              per_page: 100,
            });
            const existing = comments.find(comment => (comment.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 449,
                body,
              });
            }

      - name: Remove isolated probe image
        if: always()
        run: |
          sudo docker image rm "dpp-amazon-source-readiness:${PROBE_SHA}" >/dev/null 2>&1 || true

      - name: Enforce harness completion
        if: always()
        run: |
          test "${{ steps.probe.outputs.exit_code }}" = "0"
