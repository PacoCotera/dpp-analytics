services:
  postgres:
    image: postgres:18.4
    container_name: dpp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dpp

  worker:
    build:
      context: ./app
    image: dpp-analytics-worker:local
    container_name: dpp-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
      SPAPI_ENABLED: ${SPAPI_ENABLED:-false}
      SPAPI_ENVIRONMENT: ${SPAPI_ENVIRONMENT:-sandbox}
      SPAPI_PRODUCTION_INGESTION_ENABLED: ${SPAPI_PRODUCTION_INGESTION_ENABLED:-false}
      SPAPI_ENDPOINT: ${SPAPI_ENDPOINT:-}
      SPAPI_MARKETPLACE_ID: ${SPAPI_MARKETPLACE_ID:-A1AM78C64UM0Y8}
      SPAPI_LWA_CLIENT_ID: ${SPAPI_LWA_CLIENT_ID:-}
      SPAPI_LWA_CLIENT_SECRET: ${SPAPI_LWA_CLIENT_SECRET:-}
      SPAPI_LWA_REFRESH_TOKEN: ${SPAPI_LWA_REFRESH_TOKEN:-}
      ORDERS_BACKFILL_START: ${ORDERS_BACKFILL_START:-2025-10-01T00:00:00Z}
      FINANCES_BACKFILL_START: ${FINANCES_BACKFILL_START:-2025-10-01T00:00:00Z}
      DATA_KIOSK_BACKFILL_START: ${DATA_KIOSK_BACKFILL_START:-2025-10-01}
      ORDERS_INTERVAL_SECONDS: ${ORDERS_INTERVAL_SECONDS:-600}
      INVENTORY_INTERVAL_SECONDS: ${INVENTORY_INTERVAL_SECONDS:-1800}
      FINANCES_INTERVAL_SECONDS: ${FINANCES_INTERVAL_SECONDS:-14400}
      DATA_KIOSK_INTERVAL_SECONDS: ${DATA_KIOSK_INTERVAL_SECONDS:-43200}
      DATA_KIOSK_POLL_SECONDS: ${DATA_KIOSK_POLL_SECONDS:-10}
      DATA_KIOSK_POLL_TIMEOUT_SECONDS: ${DATA_KIOSK_POLL_TIMEOUT_SECONDS:-300}
      SANDBOX_PROBE_INTERVAL_SECONDS: ${SANDBOX_PROBE_INTERVAL_SECONDS:-21600}
      PRODUCTION_PROBE_INTERVAL_SECONDS: ${PRODUCTION_PROBE_INTERVAL_SECONDS:-21600}
    healthcheck:
      test: ["CMD", "python", "-m", "dpp_analytics.health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - dpp

  grafana:
    image: grafana/grafana:13.1.0
    container_name: dpp-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/home.json
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - dpp

networks:
  dpp:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
