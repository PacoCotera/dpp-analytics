services:
  postgres:
    image: postgres:18.4
    container_name: dpp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dpp

  worker:
    build:
      context: ./app
    image: dpp-analytics-worker:local
    container_name: dpp-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
      PRODUCT_COSTS_PATH: /config/product_costs.json
      FINANCE_ADS_CLOSE_GRACE_DAYS: ${FINANCE_ADS_CLOSE_GRACE_DAYS:-10}
      SPAPI_ENABLED: ${SPAPI_ENABLED:-false}
      SPAPI_ENVIRONMENT: ${SPAPI_ENVIRONMENT:-sandbox}
      SPAPI_PRODUCTION_INGESTION_ENABLED: ${SPAPI_PRODUCTION_INGESTION_ENABLED:-false}
      SPAPI_ENDPOINT: ${SPAPI_ENDPOINT:-}
      SPAPI_MARKETPLACE_ID: ${SPAPI_MARKETPLACE_ID:-A1AM78C64UM0Y8}
      SPAPI_LWA_CLIENT_ID: ${SPAPI_LWA_CLIENT_ID:-}
      SPAPI_LWA_CLIENT_SECRET: ${SPAPI_LWA_CLIENT_SECRET:-}
      SPAPI_LWA_REFRESH_TOKEN: ${SPAPI_LWA_REFRESH_TOKEN:-}
      AMAZON_ADS_ENABLED: ${AMAZON_ADS_ENABLED:-false}
      AMAZON_ADS_CLIENT_ID: ${AMAZON_ADS_CLIENT_ID:-}
      AMAZON_ADS_CLIENT_SECRET: ${AMAZON_ADS_CLIENT_SECRET:-}
      AMAZON_ADS_REFRESH_TOKEN: ${AMAZON_ADS_REFRESH_TOKEN:-}
      AMAZON_ADS_ACCOUNT_IDS: ${AMAZON_ADS_ACCOUNT_IDS:-}
      AMAZON_ADS_API_ENDPOINT: ${AMAZON_ADS_API_ENDPOINT:-https://advertising-api.amazon.com}
      AMAZON_ADS_REPORTING_INTERVAL_SECONDS: ${AMAZON_ADS_REPORTING_INTERVAL_SECONDS:-21600}
      AMAZON_ADS_BACKFILL_DAYS: ${AMAZON_ADS_BACKFILL_DAYS:-90}
      AMAZON_ADS_REPORT_POLL_SECONDS: ${AMAZON_ADS_REPORT_POLL_SECONDS:-5}
      AMAZON_ADS_REPORT_POLL_TIMEOUT_SECONDS: ${AMAZON_ADS_REPORT_POLL_TIMEOUT_SECONDS:-300}
      ORDERS_BACKFILL_START: ${ORDERS_BACKFILL_START:-2025-10-01T00:00:00Z}
      FINANCES_BACKFILL_START: ${FINANCES_BACKFILL_START:-2025-10-01T00:00:00Z}
      DATA_KIOSK_BACKFILL_START: ${DATA_KIOSK_BACKFILL_START:-2025-10-01}
      ORDERS_INTERVAL_SECONDS: ${ORDERS_INTERVAL_SECONDS:-180}
      INVENTORY_INTERVAL_SECONDS: ${INVENTORY_INTERVAL_SECONDS:-1800}
      FINANCES_INTERVAL_SECONDS: ${FINANCES_INTERVAL_SECONDS:-14400}
      SETTLEMENT_REPORTS_INTERVAL_SECONDS: ${SETTLEMENT_REPORTS_INTERVAL_SECONDS:-21600}
      DATA_KIOSK_INTERVAL_SECONDS: ${DATA_KIOSK_INTERVAL_SECONDS:-43200}
      LISTINGS_REPORT_INTERVAL_SECONDS: ${LISTINGS_REPORT_INTERVAL_SECONDS:-21600}
      REPORTS_POLL_SECONDS: ${REPORTS_POLL_SECONDS:-5}
      REPORTS_POLL_TIMEOUT_SECONDS: ${REPORTS_POLL_TIMEOUT_SECONDS:-300}
      CATALOG_ENABLED: ${CATALOG_ENABLED:-true}
      CATALOG_INTERVAL_SECONDS: ${CATALOG_INTERVAL_SECONDS:-86400}
      DATA_KIOSK_POLL_SECONDS: ${DATA_KIOSK_POLL_SECONDS:-10}
      DATA_KIOSK_POLL_TIMEOUT_SECONDS: ${DATA_KIOSK_POLL_TIMEOUT_SECONDS:-300}
      SANDBOX_PROBE_INTERVAL_SECONDS: ${SANDBOX_PROBE_INTERVAL_SECONDS:-21600}
      PRODUCTION_PROBE_INTERVAL_SECONDS: ${PRODUCTION_PROBE_INTERVAL_SECONDS:-21600}
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-15}
    volumes:
      - /etc/dpp-analytics/board-config:/config:ro
    healthcheck:
      test: ["CMD", "python", "-m", "dpp_analytics.health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - dpp

  board:
    build:
      context: .
      dockerfile: board/Dockerfile
      args:
        DEPLOY_SHA: ${DEPLOY_SHA:-dev}
    image: dpp-analytics-board:local
    container_name: dpp-board
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPAPI_MARKETPLACE_ID: ${SPAPI_MARKETPLACE_ID:-A1AM78C64UM0Y8}
      PRODUCT_COSTS_PATH: /config/product_costs.json
      PRODUCT_VARIATIONS_PATH: /config/product_variations.json
      PRODUCT_LABELS_PATH: /config/product_labels.json
      DPP_ADMIN_PASSWORD: ${DPP_ADMIN_PASSWORD:-}
      DPP_ADMIN_COOKIE_SECURE: ${DPP_ADMIN_COOKIE_SECURE:-false}
      DPP_ADMIN_ALLOW_REMOTE: ${DPP_ADMIN_ALLOW_REMOTE:-false}
      FINANCE_ADS_CLOSE_GRACE_DAYS: ${FINANCE_ADS_CLOSE_GRACE_DAYS:-10}
      MX_VAT_RATE: ${MX_VAT_RATE:-0.16}
      ORDERS_INTERVAL_SECONDS: ${ORDERS_INTERVAL_SECONDS:-180}
      INVENTORY_INTERVAL_SECONDS: ${INVENTORY_INTERVAL_SECONDS:-1800}
      FINANCES_INTERVAL_SECONDS: ${FINANCES_INTERVAL_SECONDS:-14400}
      SETTLEMENT_REPORTS_INTERVAL_SECONDS: ${SETTLEMENT_REPORTS_INTERVAL_SECONDS:-21600}
      DATA_KIOSK_INTERVAL_SECONDS: ${DATA_KIOSK_INTERVAL_SECONDS:-43200}
      LISTINGS_REPORT_INTERVAL_SECONDS: ${LISTINGS_REPORT_INTERVAL_SECONDS:-21600}
      CATALOG_INTERVAL_SECONDS: ${CATALOG_INTERVAL_SECONDS:-86400}
      AMAZON_ADS_REPORTING_INTERVAL_SECONDS: ${AMAZON_ADS_REPORTING_INTERVAL_SECONDS:-21600}
      TZ: ${TZ}
    ports:
      - "8088:8080"
    volumes:
      - /etc/dpp-analytics/board-config:/config:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dpp

  grafana:
    image: grafana/grafana:13.1.0
    container_name: dpp-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/home.json
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - dpp

networks:
  dpp:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
