<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12110f"><title>Dirty Pawz Press · Trajectory</title><style>
:root{--bg:#12110f;--panel:#1b1916;--ink:#f5f0e7;--muted:#aaa397;--line:#34302a;--accent:#f2a43a;--accent2:#ffcb70;--good:#8ec86f;--bad:#f26a63;--radius:18px}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 88% -10%,rgba(242,164,58,.10),transparent 34%),var(--bg)}a{color:inherit;text-decoration:none}.app{max-width:1800px;margin:0 auto;padding:22px 28px 20px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{display:flex;gap:13px;align-items:center}.mark{width:38px;height:38px;border:1px solid #4b4339;border-radius:12px;display:grid;place-items:center;color:var(--accent);font-weight:800;background:#1b1814}.brand h1{margin:0;font-size:18px;letter-spacing:.12em}.sub{margin-top:4px;color:var(--muted);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.clock{text-align:right;font-size:22px;font-weight:650}.asof{font-size:9px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;margin-top:4px}.nav{display:flex;gap:6px;margin:16px 0 14px;flex-wrap:wrap;border-bottom:1px solid #292620;padding-bottom:12px}.nav a{padding:7px 10px;border-radius:99px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#a9a196}.nav a.active{background:#2b261f;color:var(--accent2);border:1px solid #473b2c}.nav a.disabled{opacity:.38;pointer-events:none}.rail{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#302d28;border:1px solid #302d28;border-radius:var(--radius);overflow:hidden;margin-bottom:12px}.metric{background:#1d1a17;padding:15px 18px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}.eyebrow{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#9e968c;font-weight:700}.value{font-size:37px;line-height:1;font-weight:730;letter-spacing:-.04em}.note{font-size:10px;color:#989087}.good{color:var(--good)!important}.bad{color:var(--bad)!important}.grid{display:grid;grid-template-columns:1.8fr .8fr;gap:12px}.panel{border:1px solid #302d28;border-radius:var(--radius);background:rgba(28,26,22,.84);overflow:hidden}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:15px 16px 0}.panel-head h2{margin:0;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#d7d0c6}.panel-head span{font-size:9px;color:#8c857c}.chart-wrap{padding:4px 12px 12px}.chart{width:100%;height:390px;display:block}.gridline{stroke:#37322c;stroke-width:1}.axis{fill:#8f887e;font-size:10px}.bar{fill:#8a5c27;opacity:.22}.trend{fill:none;stroke:#f5f0e7;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.trendGlow{fill:none;stroke:#f2a43a;stroke-width:10;opacity:.06}.horizons{padding:5px 16px 14px}.horizon{padding:15px 0;border-top:1px solid #2d2924}.horizon:first-child{border-top:0}.h-top{display:flex;justify-content:space-between;align-items:baseline}.h-label{font-size:10px;letter-spacing:.12em;color:#9d958b}.h-delta{font-size:20px;font-weight:720}.h-sub{margin-top:7px;display:flex;justify-content:space-between;gap:12px;font-size:9px;color:#8f887e}.h-sub b{color:#e4ddd2;font-size:12px}.footer{display:flex;justify-content:space-between;color:#716b62;font-size:8px;letter-spacing:.09em;text-transform:uppercase;margin-top:12px;padding:0 4px}.error{position:fixed;right:18px;bottom:18px;background:#4b2623;color:#ffd1cc;padding:10px 13px;border-radius:10px;font-size:11px;display:none}@media(max-width:1100px){.app{padding:16px}.rail{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.clock{display:none}}@media(max-width:650px){.app{padding:12px}.rail{grid-template-columns:1fr}.nav{overflow:auto;flex-wrap:nowrap}.value{font-size:34px}}
</style></head><body><div class="app"><header class="topbar"><div class="brand"><div class="mark">DP</div><div><h1>DIRTY PAWZ PRESS</h1><div class="sub">Trajectory · Amazon Mexico</div></div></div><div><div class="clock" id="clock">--:--</div><div class="asof" id="asof">Updating</div></div></header><nav class="nav"><a href="/">Home</a><a href="/sales">Sales</a><a href="/catalog">Catalog</a><a class="disabled">Ads</a><a href="/inventory">Inventory</a><a class="disabled">Finance</a><a class="active" href="/trajectory">Trajectory</a><a href="/data-health">Data Health</a></nav><section class="rail" id="rail"></section><section class="grid"><div class="panel"><div class="panel-head"><h2>Business trajectory · 180 days</h2><span>Daily sales · 28-day signal</span></div><div class="chart-wrap"><svg class="chart" id="chart" viewBox="0 0 1000 390" preserveAspectRatio="none"></svg></div></div><div class="panel"><div class="panel-head"><h2>Momentum</h2><span>Current vs prior horizon</span></div><div class="horizons" id="horizons"></div></div></section><footer class="footer"><span>Direction over noise · reconciled daily sales</span><span>Dirty Pawz Press analytics</span></footer></div><div class="error" id="error"></div><script>(function(){var fmt=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});function money(v){return '$'+fmt.format(Math.round(Number(v||0)))}function pct(v){if(v===null||v===undefined)return '—';var n=Number(v);return (n>0?'+':'')+n.toFixed(1)+'%'}function cls(v){var n=Number(v);return n>0?'good':n<0?'bad':''}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function chart(rows){var svg=document.getElementById('chart'),W=1000,H=390,L=58,R=10,T=16,B=30,w=W-L-R,h=H-T-B;if(!rows||!rows.length){svg.innerHTML='';return}var vals=rows.map(function(r){return Number(r.sales||0)}),avg=rows.map(function(r){return Number(r.avg28||0)}),max=Math.max.apply(null,vals.concat(avg).concat([100]));max=Math.ceil(max/500)*500;var x=function(i){return L+(i+.5)*w/rows.length},y=function(v){return T+h-(v/max)*h},out=[];for(var g=0;g<=4;g++){var gy=T+h*g/4,gv=max*(1-g/4);out.push('<line class="gridline" x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'"/><text class="axis" x="'+(L-8)+'" y="'+(gy+3)+'" text-anchor="end">$'+fmt.format(gv)+'</text>')}var bw=Math.max(1.5,w/rows.length*.42);rows.forEach(function(r,i){var yy=y(Number(r.sales||0));out.push('<rect class="bar" x="'+(x(i)-bw/2)+'" y="'+yy+'" width="'+bw+'" height="'+Math.max(0,T+h-yy)+'"/>')});var pts=avg.map(function(v,i){return x(i)+','+y(v)}).join(' ');out.push('<polyline class="trendGlow" points="'+pts+'"/><polyline class="trend" points="'+pts+'"/>');[0,Math.floor((rows.length-1)/2),rows.length-1].forEach(function(i){out.push('<text class="axis" x="'+x(i)+'" y="'+(H-7)+'" text-anchor="middle">'+esc(String(rows[i].business_date||'').slice(5))+'</text>')});svg.innerHTML=out.join('')}function render(d){document.getElementById('clock').textContent=d.local_time||'--:--';document.getElementById('asof').textContent='Reconciled through '+String((d.headline||{}).business_date||'');var hs=d.horizons||[];document.getElementById('rail').innerHTML=hs.map(function(r){return '<div class="metric"><div class="eyebrow">'+esc(r.label)+' trajectory</div><div class="value '+cls(r.delta_pct)+'">'+pct(r.delta_pct)+'</div><div class="note">'+money(r.sales)+' · '+money(r.daily_avg)+'/day</div></div>'}).join('');document.getElementById('horizons').innerHTML=hs.map(function(r){return '<div class="horizon"><div class="h-top"><span class="h-label">'+esc(r.label)+'</span><span class="h-delta '+cls(r.delta_pct)+'">'+pct(r.delta_pct)+'</span></div><div class="h-sub"><span><b>'+money(r.sales)+'</b> sales</span><span><b>'+money(r.daily_avg)+'</b> / day</span></div></div>'}).join('');chart(d.series)}function load(){fetch('/api/trajectory',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(render).catch(function(e){var x=document.getElementById('error');x.textContent='Trajectory data unavailable · '+e.message;x.style.display='block'})}load();setInterval(load,60000)})();</script></body></html>
